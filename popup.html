<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MyAutoScroll</title>
  <style>
    body { width: 270px; margin: 0; padding: 14px; font: 14px system-ui, sans-serif; color: #222; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    button { width: 100%; padding: 9px; font-size: 14px; font-weight: 600; border: 0; border-radius: 6px;
             background: #2f6fed; color: #fff; cursor: pointer; }
    button:hover { background: #2559c4; }
    label.row { display: flex; justify-content: space-between; margin: 14px 0 4px; }
    label.check { display: flex; align-items: center; gap: 8px; margin: 14px 0 0; }
    input[type=range] { width: 100%; }
    .hint { margin-top: 14px; font-size: 12px; color: #666; line-height: 1.5; }
    kbd { background: #eee; border-radius: 3px; padding: 1px 5px; font-size: 11px; }
    #status { margin-top: 8px; font-size: 12px; color: #c0392b; min-height: 1em; }
  </style>
</head>
<body>
  <h1>MyAutoScroll</h1>
  <button id="toggle">Start / Pause</button>

  <label class="row" for="speed"><span>Speed (px/sec)</span><strong id="speedVal">60</strong></label>
  <input id="speed" type="range" min="10" max="600" step="10" value="60" />

  <label class="check"><input id="smartSlow" type="checkbox" checked /> Slow down over text bubbles</label>
  <label class="row" for="slow"><span>Speed over text</span><strong id="slowVal">40%</strong></label>
  <input id="slow" type="range" min="10" max="100" step="5" value="40" />

  <label class="check"><input id="debug" type="checkbox" /> Show detection overlay</label>

  <div id="status"></div>

  <div class="hint">
    <kbd>Space</kbd> start / pause<br />
    <kbd>[</kbd> / <kbd>]</kbd> slower / faster<br />
    <kbd>T</kbd> slow-on-text on/off · <kbd>D</kbd> overlay<br />
    <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> global shortcut<br />
    (change at chrome://extensions/shortcuts)
  </div>
  <script src="popup.js"></script>
</body>
</html>
